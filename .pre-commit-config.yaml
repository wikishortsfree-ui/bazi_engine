# Pre-commit hooks for bazi_engine
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Skip pytest on commit: SKIP=pytest git commit ...

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: bash -c 'cd . && pytest tests/test_clashes.py tests/test_encoding_consistency.py tests/test_harms.py tests/test_destructions.py tests/test_punishments.py tests/test_three_harmony.py -x -q'
        language: system
        pass_filenames: false
